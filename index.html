<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>W3D</title>
  <link rel="stylesheet" href="src/normalise.css">
  <link rel="stylesheet" href="src/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>


  <div id="outliner-container">
    <p id="outliner-title">Outliner</p>
    <div id="outliner-content">
      <ul id="scene-graph">
        <li><button>init</button></li>
      </ul>
    </div>
  </div>

  <div id="properties-container" class="collapsed">

  </div>

  <div id="toolbar">
    <div class="toolbar-section">
      <span class="section-label">CREATE</span>
      <div id="toolbar-links">
        <button id="add-cube" aria-label="Create Cube" data-tooltip="Create Cube">
          <span class="tool-icon">◻</span>
        </button>
        <button id="add-sphere" aria-label="Create Sphere" data-tooltip="Create Sphere">
          <span class="tool-icon">○</span>
        </button>
        <button id="import-obj-btn" aria-label="Import OBJ" data-tooltip="Import OBJ">
          <span class="tool-icon">⮋</span>
        </button>
        <input type="file" id="import-obj" accept=".obj" style="display: none;">
      </div>
    </div>

    <div class="toolbar-section">
      <span class="section-label">TRANSFORM</span>
      <div id="toolbar-links">
        <button id="move" class="mode-button" aria-label="Move Tool (W)" data-tooltip="Move Tool (W)">
          <span class="tool-icon">↹</span>
        </button>
        <button id="rot" class="mode-button" aria-label="Rotate Tool" data-tooltip="Rotate Tool">
          <span class="tool-icon">⟳</span>
        </button>
        <button id="scale" class="mode-button" aria-label="Scale Tool (R)" data-tooltip="Scale Tool (R)">
          <span class="tool-icon">⤧</span>
        </button>
      </div>
    </div>

    <div class="toolbar-section">
      <span class="section-label">SELECTION</span>
      <div id="toolbar-links">
        <button id="object-mode" class="mode-button active" aria-label="Object Mode (1)" data-tooltip="Object Mode (1)">
          <span class="tool-icon">□</span>
        </button>
        <button id="vertex-mode" class="mode-button" aria-label="Vertex Mode (2)" data-tooltip="Vertex Mode (2)">
          <span class="tool-icon">•</span>
        </button>
        <button id="edge-mode" class="mode-button" aria-label="Edge Mode (3)" data-tooltip="Edge Mode (3)">
          <span class="tool-icon">╱</span>
        </button>
        <button id="face-mode" class="mode-button" aria-label="Face Mode (4)" data-tooltip="Face Mode (4)">
          <span class="tool-icon">▢</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Loading indicator, initially hidden -->
  <div id="loading-indicator"
    style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 20px; background: rgba(0,0,0,0.7); color: white; border-radius: 5px; z-index: 9999;">
    Loading model...
  </div>

</body>
<script type="module" src="/src/main.js"></script>

</html>

<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vite App</title>
  <link rel="stylesheet" href="src/normalise.css">
  <link rel="stylesheet" href="src/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>


  <div id="outliner-container">
    <p id="outliner-title">Outliner</p>
    <div id="outliner-content">
      <ul id="scene-graph">
        <li><button>111</button></li>
      </ul>
    </div>
  </div>

  <div id="properties-container">

  </div>

  <div id="toolbar">
    <div class="toolbar-section">
      <span class="section-label">CREATE</span>
      <div id="toolbar-links">
        <button id="add-cube" data-tooltip="Create Cube">
          <span class="tool-icon">◻</span>
        </button>
        <button id="add-sphere" data-tooltip="Create Sphere">
          <span class="tool-icon">○</span>
        </button>
        <button id="add-cylinder" data-tooltip="Create Cylinder">
          <span class="tool-icon">⌭</span>
        </button>
        <button id="add-plane" data-tooltip="Create Plane">
          <span class="tool-icon">▭</span>
        </button>
      </div>
    </div>

    <div class="toolbar-section">
      <span class="section-label">TRANSFORM</span>
      <div id="toolbar-links">
        <button id="move" class="mode-button" data-tooltip="Move Tool (W)">
          <span class="tool-icon">↹</span>
        </button>
        <button id="rot" class="mode-button" data-tooltip="Rotate Tool">
          <span class="tool-icon">⟳</span>
        </button>
        <button id="scale" class="mode-button" data-tooltip="Scale Tool (R)">
          <span class="tool-icon">⤧</span>
        </button>
      </div>
    </div>

    <div class="toolbar-section">
      <span class="section-label">SELECTION</span>
      <div id="toolbar-links">
        <button id="object-mode" class="mode-button active" data-tooltip="Object Mode (1)">
          <span class="tool-icon">□</span>
        </button>
        <button id="vertex-mode" class="mode-button" data-tooltip="Vertex Mode (2)">
          <span class="tool-icon">•</span>
        </button>
        <button id="edge-mode" class="mode-button" data-tooltip="Edge Mode (3)">
          <span class="tool-icon">╱</span>
        </button>
        <button id="face-mode" class="mode-button" data-tooltip="Face Mode (4)">
          <span class="tool-icon">▢</span>
        </button>
      </div>
    </div>

    <!-- <div class="toolbar-section">
      <span class="section-label">MODIFY</span>
      <div id="toolbar-links">
        <button id="extrude-face" data-tooltip="Extrude Face">
          <span class="tool-icon">⇗</span>
        </button>
        <button id="split-face" data-tooltip="Split Face">
          <span class="tool-icon">✂</span>
        </button>
        <button id="bevel" data-tooltip="Bevel">
          <span class="tool-icon">◢</span>
        </button>
      </div>
    </div> -->
  </div>


</body>
<script type="module" src="/src/main.js"></script>

</html>
